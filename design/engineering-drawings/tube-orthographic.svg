<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1100" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="BGKPJR Stage 1 — orthographic engineering drawings: side view, plan view, end-view cross-sections at breech and muzzle. Scale 1:N as noted. All dimensions traceable to bgkpjr_dimensions.py canonical source-of-truth.">
  <title>BGKPJR Stage 1 — Orthographic Engineering Drawing v1.0</title>

  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
      .display { font-family: 'Inter', 'Helvetica Neue', sans-serif; font-weight: 700; }
      .dim-line { stroke: #00e5ff; stroke-width: 0.7; fill: none; }
      .dim-arrow { fill: #00e5ff; }
      .dim-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #00e5ff; }
      .label { font-family: 'JetBrains Mono', monospace; font-size: 10px; fill: #ddeeff; letter-spacing: 0.08em; }
      .note { font-family: 'JetBrains Mono', monospace; font-size: 9px; fill: #8faec8; letter-spacing: 0.05em; }
      .center { stroke: #ffaa00; stroke-width: 0.5; stroke-dasharray: 6 2 1 2; fill: none; }
      .struct { stroke: #ddeeff; stroke-width: 1.2; fill: none; }
      .hidden { stroke: #4d6680; stroke-width: 0.6; stroke-dasharray: 4 3; fill: none; }
      .fill-coil { fill: #00e5ff; opacity: 0.18; stroke: #00e5ff; stroke-width: 0.8; }
      .fill-ground { fill: #ffaa00; opacity: 0.10; stroke: #ffaa00; stroke-width: 0.6; }
      .scale-bar { stroke: #ddeeff; stroke-width: 1.5; fill: none; }
    </style>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="dim-arrow"/>
    </marker>
    <marker id="arr-l" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 10 0 L 0 5 L 10 10 z" class="dim-arrow"/>
    </marker>
  </defs>

  <!-- ─── frame & title block ─── -->
  <rect x="0" y="0" width="1700" height="1100" fill="#040910"/>
  <rect x="20" y="20" width="1660" height="1060" fill="none" stroke="#192e4c" stroke-width="1.5"/>

  <!-- title block -->
  <g transform="translate(40, 50)">
    <text class="display" font-size="24" fill="#ddeeff">BGKPJR — STAGE 1 ORTHOGRAPHIC ENGINEERING DRAWING</text>
    <text class="mono" font-size="11" fill="#8faec8" y="22" letter-spacing="0.18em">DRG REV 1.0 · 2026-04-30 · CANONICAL VG BASELINE · CLASSIFICATION: PRE-PHASE A</text>
    <text class="mono" font-size="11" fill="#4d6680" y="42" letter-spacing="0.12em">ALL DIMENSIONS TRACEABLE TO bgkpjr_dimensions.py · Run derive_check() to verify · Tolerance: ±1%</text>
  </g>

  <!-- title block right -->
  <g transform="translate(1660, 50)" text-anchor="end">
    <text class="mono" font-size="11" fill="#8faec8" letter-spacing="0.18em">SHEET 1 OF 1</text>
    <text class="mono" font-size="11" fill="#4d6680" y="18" letter-spacing="0.12em">PROJECTION: ORTHOGRAPHIC THIRD-ANGLE</text>
    <text class="mono" font-size="11" fill="#4d6680" y="32" letter-spacing="0.12em">DRAWN BY: CLAUDE OPUS 4.7 (1M)</text>
    <text class="mono" font-size="11" fill="#4d6680" y="46" letter-spacing="0.12em">FOR REVIEW: SCOTT LUKENS, VICTORY SOLUTIONS INC</text>
  </g>

  <line x1="40" y1="115" x2="1660" y2="115" stroke="#192e4c" stroke-width="1"/>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- VIEW 1 — SIDE ELEVATION (1:50,000 scale, full 37 km)         -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g transform="translate(40, 145)">
    <text class="label" font-size="13" fill="#00e5ff">VIEW 1 — SIDE ELEVATION (1 : 50,000)</text>
    <text class="note" y="14">Section A-A · 37 km tube on 15° incline · representative coil density not to scale</text>

    <!-- ground reference -->
    <line x1="0" y1="200" x2="1300" y2="115" class="hidden"/>
    <text class="note" x="0" y="210">GROUND</text>

    <!-- tube on incline (740mm represents 37km at 1:50000) -->
    <g transform="translate(50, 200) rotate(-15)">
      <!-- outer tube shell -->
      <rect x="0" y="-30" width="740" height="60" class="struct"/>
      <!-- inner bore -->
      <rect x="0" y="-22" width="740" height="44" class="hidden"/>
      <!-- centerline -->
      <line x1="0" y1="0" x2="740" y2="0" class="center"/>

      <!-- breech end (left) -->
      <rect x="-30" y="-40" width="30" height="80" class="struct" fill="#0a1422" fill-opacity="0.5"/>
      <text class="label" x="-15" y="50" text-anchor="middle" font-size="9">BREECH</text>

      <!-- muzzle end (right) -->
      <rect x="740" y="-40" width="30" height="80" class="struct" fill="#0a1422" fill-opacity="0.5"/>
      <line x1="745" y1="-30" x2="745" y2="30" stroke="#00e5ff" stroke-width="1.2"/>
      <line x1="753" y1="-25" x2="753" y2="25" stroke="#aaaaaa" stroke-width="0.8"/>
      <line x1="761" y1="-20" x2="761" y2="20" stroke="#ffaa00" stroke-width="1.2"/>
      <text class="label" x="755" y="50" text-anchor="middle" font-size="9">MUZZLE · LH₂ MEMBRANE</text>

      <!-- representative coils (every ~50mm = 2.5km in real scale) -->
      <g>
        <line x1="50" y1="-30" x2="50" y2="30" class="fill-coil"/>
        <line x1="100" y1="-30" x2="100" y2="30" class="fill-coil"/>
        <line x1="150" y1="-30" x2="150" y2="30" class="fill-coil"/>
        <line x1="200" y1="-30" x2="200" y2="30" class="fill-coil"/>
        <line x1="250" y1="-30" x2="250" y2="30" class="fill-coil"/>
        <line x1="300" y1="-30" x2="300" y2="30" class="fill-coil"/>
        <line x1="350" y1="-30" x2="350" y2="30" class="fill-coil"/>
        <line x1="400" y1="-30" x2="400" y2="30" class="fill-coil"/>
        <line x1="450" y1="-30" x2="450" y2="30" class="fill-coil"/>
        <line x1="500" y1="-30" x2="500" y2="30" class="fill-coil"/>
        <line x1="550" y1="-30" x2="550" y2="30" class="fill-coil"/>
        <line x1="600" y1="-30" x2="600" y2="30" class="fill-coil"/>
        <line x1="650" y1="-30" x2="650" y2="30" class="fill-coil"/>
        <line x1="690" y1="-30" x2="690" y2="30" class="fill-coil"/>
      </g>
    </g>

    <!-- length dimension -->
    <g transform="translate(0, 280)">
      <line x1="50" y1="0" x2="765" y2="-200" class="dim-line" marker-end="url(#arr-r)" marker-start="url(#arr-l)"/>
      <text class="dim-text" x="400" y="-90">37,000 m   (37.000 km)</text>
      <text class="note" x="400" y="-78">SoT.RAIL.LENGTH_M</text>
    </g>

    <!-- inclination angle -->
    <g transform="translate(50, 200)">
      <path d="M 60 0 A 60 60 0 0 0 58 -16" class="dim-line"/>
      <text class="dim-text" x="78" y="-8" font-size="10">15°</text>
      <text class="note" x="78" y="4" font-size="8">SoT.RAIL.INCLINATION_DEG</text>
    </g>

    <!-- scale bar -->
    <g transform="translate(1000, 280)">
      <line x1="0" y1="0" x2="200" y2="0" class="scale-bar"/>
      <line x1="0" y1="-5" x2="0" y2="5" class="scale-bar"/>
      <line x1="100" y1="-5" x2="100" y2="5" class="scale-bar"/>
      <line x1="200" y1="-5" x2="200" y2="5" class="scale-bar"/>
      <text class="note" x="0" y="18" font-size="9">0</text>
      <text class="note" x="100" y="18" font-size="9" text-anchor="middle">5 km</text>
      <text class="note" x="200" y="18" font-size="9" text-anchor="end">10 km</text>
      <text class="note" x="100" y="-12" font-size="9" text-anchor="middle">SCALE 1 : 50,000</text>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- VIEW 2 — PLAN (TOP) (1:50,000 scale)                          -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g transform="translate(40, 510)">
    <text class="label" font-size="13" fill="#00e5ff">VIEW 2 — PLAN (TOP) (1 : 50,000)</text>
    <text class="note" y="14">Looking down · 37 km straight-line alignment · Hazel Green AL site</text>

    <g transform="translate(50, 80)">
      <!-- tube outline (top view) -->
      <rect x="0" y="-30" width="740" height="60" class="struct"/>
      <line x1="0" y1="0" x2="740" y2="0" class="center"/>

      <!-- breech & muzzle in plan -->
      <rect x="-30" y="-40" width="30" height="80" class="struct" fill="#0a1422" fill-opacity="0.5"/>
      <rect x="740" y="-40" width="30" height="80" class="struct" fill="#0a1422" fill-opacity="0.5"/>

      <!-- power feed bus (left side) -->
      <rect x="-30" y="50" width="200" height="20" class="struct" fill="#ffaa00" fill-opacity="0.10"/>
      <text class="label" x="70" y="64" text-anchor="middle" font-size="9">POWER · 39 GW SMES BANK</text>

      <!-- vacuum pump stations (every 5 km nominal) -->
      <g>
        <rect x="100" y="40" width="20" height="14" class="struct" fill="#192e4c"/>
        <rect x="200" y="40" width="20" height="14" class="struct" fill="#192e4c"/>
        <rect x="300" y="40" width="20" height="14" class="struct" fill="#192e4c"/>
        <rect x="400" y="40" width="20" height="14" class="struct" fill="#192e4c"/>
        <rect x="500" y="40" width="20" height="14" class="struct" fill="#192e4c"/>
        <rect x="600" y="40" width="20" height="14" class="struct" fill="#192e4c"/>
        <rect x="700" y="40" width="20" height="14" class="struct" fill="#192e4c"/>
      </g>
      <text class="note" x="350" y="78" font-size="9">VACUUM PUMP STATIONS · ~5 km O.C.</text>

      <!-- bore diameter callout -->
      <line x1="200" y1="-30" x2="200" y2="30" class="dim-line" marker-end="url(#arr-r)" marker-start="url(#arr-l)"/>
      <text class="dim-text" x="220" y="2">10.0 m bore</text>
      <text class="note" x="220" y="14" font-size="9">SoT.RAIL.DIAMETER_M</text>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- VIEW 3 — END VIEW: BREECH (1:100 scale)                       -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g transform="translate(40, 720)">
    <text class="label" font-size="13" fill="#00e5ff">VIEW 3 — END VIEW: BREECH (1 : 100)</text>
    <text class="note" y="14">Looking up-bore from breech end · drive coil cross-section</text>

    <g transform="translate(280, 230)">
      <!-- outer tube wall -->
      <circle cx="0" cy="0" r="100" class="struct"/>
      <!-- inner bore -->
      <circle cx="0" cy="0" r="80" class="hidden"/>
      <!-- coil ring -->
      <circle cx="0" cy="0" r="92" stroke="#00e5ff" stroke-width="3" fill="none"/>
      <!-- centerline crosshair -->
      <line x1="-130" y1="0" x2="130" y2="0" class="center"/>
      <line x1="0" y1="-130" x2="0" y2="130" class="center"/>

      <!-- pod cross-section (centered in bore) -->
      <circle cx="0" cy="0" r="25" class="struct" fill="#0a1422" fill-opacity="0.5"/>
      <text class="label" x="0" y="3" text-anchor="middle" font-size="8">POD</text>

      <!-- bore diameter dim -->
      <line x1="-80" y1="-110" x2="80" y2="-110" class="dim-line" marker-end="url(#arr-r)" marker-start="url(#arr-l)"/>
      <text class="dim-text" x="0" y="-118" text-anchor="middle">⌀ 10.0 m bore</text>

      <!-- coil OD dim -->
      <line x1="100" y1="0" x2="170" y2="0" class="dim-line"/>
      <text class="dim-text" x="180" y="3">⌀ 20.0 m coil OD</text>
      <line x1="92" y1="20" x2="170" y2="20" class="dim-line"/>
      <text class="dim-text" x="180" y="23">⌀ 16.0 m coil ID</text>

      <!-- pod dim -->
      <line x1="-25" y1="50" x2="25" y2="50" class="dim-line" marker-end="url(#arr-r)" marker-start="url(#arr-l)"/>
      <text class="dim-text" x="0" y="64" text-anchor="middle">⌀ 1.8 m pod</text>
      <text class="note" x="0" y="76" text-anchor="middle">Manna chassis</text>
    </g>

    <g transform="translate(450, 100)">
      <text class="label" font-size="11" fill="#ddeeff">DRIVE COIL SPECIFICATION</text>
      <text class="mono" y="20" font-size="10" fill="#8faec8">Material  : Copper C10100 OFHC</text>
      <text class="mono" y="35" font-size="10" fill="#8faec8">Turns     : 50 per coil</text>
      <text class="mono" y="50" font-size="10" fill="#8faec8">Axial L   : 2.0 m</text>
      <text class="mono" y="65" font-size="10" fill="#8faec8">Spacing   : 5.0 m (λ/2 sync)</text>
      <text class="mono" y="80" font-size="10" fill="#8faec8">Total     : 7,400 coils</text>
      <text class="mono" y="95" font-size="10" fill="#8faec8">Peak field: 8.0 T</text>
      <text class="mono" y="110" font-size="10" fill="#8faec8">Cooling   : Active liquid-water (drive)</text>
      <text class="mono" y="125" font-size="10" fill="#8faec8">Architect.: LSM (NOT railgun)</text>
      <text class="mono" y="145" font-size="9" fill="#4d6680">Per McNab review correction (2025-04)</text>
    </g>
  </g>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!-- VIEW 4 — END VIEW: MUZZLE LH₂ MEMBRANE (1:100 scale)         -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g transform="translate(900, 720)">
    <text class="label" font-size="13" fill="#00e5ff">VIEW 4 — END VIEW: MUZZLE LH₂ MEMBRANE (1 : 100)</text>
    <text class="note" y="14">Section A-A at muzzle exit · LH₂ canonical alternative shown</text>

    <g transform="translate(280, 230)">
      <!-- outer flange -->
      <circle cx="0" cy="0" r="105" class="struct"/>
      <!-- L3 carbon fiber diaphragm (outermost) -->
      <circle cx="0" cy="0" r="100" stroke="#ddeeff" stroke-width="1.4" fill="none"/>
      <!-- L2 thermal isolation buffer -->
      <circle cx="0" cy="0" r="95" stroke="#aaaaaa" stroke-width="1" fill="none" stroke-dasharray="3 1"/>
      <!-- L1 LH₂ membrane (canonical, amber) -->
      <circle cx="0" cy="0" r="90" stroke="#ffaa00" stroke-width="2" fill="#ffaa00" fill-opacity="0.10"/>
      <!-- inner bore -->
      <circle cx="0" cy="0" r="80" class="hidden"/>
      <!-- centerline crosshair -->
      <line x1="-130" y1="0" x2="130" y2="0" class="center"/>
      <line x1="0" y1="-130" x2="0" y2="130" class="center"/>

      <!-- callouts -->
      <line x1="100" y1="-70" x2="160" y2="-100" class="dim-line"/>
      <text class="dim-text" x="170" y="-100" font-size="10">L3 — Carbon Fiber Diaphragm</text>
      <text class="note" x="170" y="-89" font-size="8">Holds tube vacuum · scored for fracture</text>

      <line x1="95" y1="-30" x2="160" y2="-30" class="dim-line"/>
      <text class="dim-text" x="170" y="-30" font-size="10">L2 — Aerogel Thermal Buffer</text>
      <text class="note" x="170" y="-19" font-size="8">25 cm · isolates L1 from L3</text>

      <line x1="90" y1="40" x2="160" y2="40" class="dim-line"/>
      <text class="dim-text" x="170" y="40" font-size="10">L1 — LH₂ MEMBRANE (20 K)</text>
      <text class="note" x="170" y="51" font-size="8">~3 cm · novel IP · controlled detonation = +50 m/s Δv</text>

      <line x1="0" y1="80" x2="-100" y2="120" class="dim-line"/>
      <text class="dim-text" x="-100" y="125" font-size="10" text-anchor="end">Bore (vacuum side)</text>
    </g>

    <g transform="translate(450, 100)">
      <text class="label" font-size="11" fill="#ddeeff">MUZZLE TRADE STUDY (Phase 0)</text>
      <text class="mono" y="20" font-size="10" fill="#00e5ff">CANONICAL : LH₂ Cryogenic Membrane</text>
      <text class="mono" y="35" font-size="10" fill="#8faec8">  · 20 K · 1.77 MPa stagnation</text>
      <text class="mono" y="50" font-size="10" fill="#8faec8">  · Reset 30 min · +50 m/s Δv</text>
      <text class="mono" y="65" font-size="10" fill="#8faec8">  · Novel IP · detonation control = risk</text>
      <text class="mono" y="90" font-size="10" fill="#ffaa00">ALTERNATIVE : Thermite (Al/Fe₂O₃)</text>
      <text class="mono" y="105" font-size="10" fill="#8faec8">  · 2,000 °C · 50 μs ignition</text>
      <text class="mono" y="120" font-size="10" fill="#8faec8">  · Reset 8 min · no thrust gain</text>
      <text class="mono" y="135" font-size="10" fill="#8faec8">  · Known reaction · $2,400/seal</text>
      <text class="mono" y="155" font-size="9" fill="#4d6680">Trade study deliverable: Phase 0</text>
    </g>
  </g>

  <!-- bottom note bar -->
  <line x1="40" y1="1020" x2="1660" y2="1020" stroke="#192e4c" stroke-width="1"/>
  <g transform="translate(40, 1042)">
    <text class="mono" font-size="10" fill="#4d6680" letter-spacing="0.12em">UNITS · METRIC · ALL DIMENSIONS NOMINAL · TOLERANCES PER PHASE 0 SPEC TBD</text>
    <text class="mono" font-size="10" fill="#4d6680" y="14" letter-spacing="0.12em">SOURCE OF TRUTH · BGKPJR-Core-Simulations / simulation / src / bgkpjr_dimensions.py</text>
    <text class="mono" font-size="10" fill="#4d6680" y="28" letter-spacing="0.12em">FOR REVIEW · SCOTT LUKENS · SR. SYSTEMS ENGINEER · VICTORY SOLUTIONS INC. · NASA MARSHALL CONTRACTOR</text>
  </g>

</svg>
